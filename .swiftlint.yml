# SwiftLint Configuration for PulseRT

# Paths to include
included:
  - PulseRT

# Paths to exclude
excluded:
  - build
  - .build
  - .venv
  - "**/*.generated.swift"

# Rules
disabled_rules:
  - trailing_comma           # Allow trailing commas
  - identifier_name          # Allow short names like 'x', 'id'
  - type_body_length         # Views can be long
  - file_length              # Files can exceed default limits
  - function_body_length     # Complex functions are sometimes needed

opt_in_rules:
  - empty_count              # Prefer .isEmpty over .count == 0
  - empty_string             # Prefer .isEmpty over == ""
  - force_unwrapping         # Warn on force unwrapping
  - implicitly_unwrapped_optional  # Warn on implicitly unwrapped optionals
  - modifier_order           # Consistent modifier ordering
  - vertical_whitespace_closing_braces  # No blank lines before closing braces
  - vertical_whitespace_opening_braces  # No blank lines after opening braces

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_name:
  min_length: 2
  max_length: 50

nesting:
  type_level: 3
  function_level: 5

# Custom rules
custom_rules:
  no_print:
    name: "No print statements"
    regex: "\\bprint\\s*\\("
    message: "Use proper logging instead of print statements"
    severity: warning
